[dns_servers]
dns01 ansible_host=10.50.20.10 
dns02 ansible_host=10.50.20.11

[app_servers]
intranet01 ansible_host=10.50.20.20
hr-app01 ansible_host=10.50.20.21
finance-app01 ansible_host=10.50.20.22

[db_servers]
db01 ansible_host=10.50.20.30

[file_servers]
files01 ansible_host=10.50.20.40

[web_servers]
web01 ansible_host=10.50.40.10

[monitoring_servers]
monitor01 ansible_host=10.50.10.20

[logging_servers]
logs01 ansible_host=10.50.10.21

[backup_servers]
backup01 ansible_host=10.50.10.22


# web_servers is excluded from the current Rocky rollout.
# web01 bootstrap failed; recovery awaits the DMZ policy design.

[rocky_servers:children]
dns_servers
app_servers
db_servers
file_servers
monitoring_servers
logging_servers
backup_servers

[rocky_servers:vars]
ansible_user=faisal 
ansible_ssh_private_key_file=~/.ssh/id_ed25519_labcorp_vm_ops-control01
fleet_expected_ipv4_netmask=255.255.255.0
fleet_expected_dns_search=labcorp.internal

[zone_servers:children]
dns_servers
app_servers
db_servers
file_servers

[zone_servers:vars]
fleet_expected_ipv4_gateway=10.50.20.1
fleet_expected_dns_server=10.50.20.1

[zone_mgmt:children]
monitoring_servers
logging_servers
backup_servers

[zone_mgmt:vars]
fleet_expected_ipv4_gateway=10.50.10.1
fleet_expected_dns_server=10.50.10.1

